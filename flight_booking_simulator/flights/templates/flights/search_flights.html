{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Finder | FlyHigh</title>
  <link rel="stylesheet" href="{% static 'flights/css/search_flights.css' %}" />
</head>
<body>
  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <h1>✈️ FlyHigh Flight Finder</h1>
  </header>

  <!-- ===== Main Container ===== -->
  <main class="container">
    <section class="search-box">
      <h2>Search for Flights</h2>

      <form id="flightSearchForm">
        <div class="form-group">
          <label for="origin">Origin City</label>
          <input type="text" id="origin" name="origin" placeholder="Enter origin city" required />
        </div>

        <div class="form-group">
          <label for="destination">Destination City</label>
          <input type="text" id="destination" name="destination" placeholder="Enter destination city" required />
        </div>

        <div class="form-group">
          <label for="date">Travel Date</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <label for="sort">Sort By</label>
          <select id="sort" name="sort">
            <option value="price">Price</option>
            <option value="duration">Duration</option>
          </select>
        </div>

        <button type="submit" class="btn">🔍 Search Flights</button>
      </form>

      <div id="errorBox" class="error-box" role="alert"></div>
    </section>

    <!-- ===== Results Section ===== -->
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <footer>
    <p>© 2025 FlyHigh Airlines. All Rights Reserved.</p>
  </footer>

  <script src="{% static 'flights/js/search_flights.js' %}"></script>
</body>
</html>
