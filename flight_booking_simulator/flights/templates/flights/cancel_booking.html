{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cancel Booking</title>
  <link rel="stylesheet" href="{% static 'flights/css/cancel_booking.css' %}" />
</head>
<body>
  <h1>Cancel Booking</h1>

  <form id="cancel-form">
    {% csrf_token %}
    <label>Enter PNR to Cancel:
      <input type="text" name="pnr" id="pnr-input" required />
    </label>
    <button type="submit">Cancel Booking</button>
  </form>

  <div id="cancel-response"></div>

  <script src="{% static 'flights/js/cancel_booking.js' %}"></script>
</body>
</html>
